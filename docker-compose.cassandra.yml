services:
  cassandra:
    image: cassandra:5.0.3
    ports:
      - "9042:9042"
    volumes:
      - ./persistence-data/cassandra-data:/var/lib/cassandra
      - ./migrations/setup.sh:/usr/setup.sh
      - ./migrations/setup.cql:/usr/setup.cql
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "chmod +x /usr/setup.sh &&
        nohup /usr/setup.sh &> /usr/setup.log &
        docker-entrypoint.sh cassandra -f"
    networks:
      - default

networks:
  default:
    external: true
    name: streamware_default
